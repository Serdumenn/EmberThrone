name: Android Build (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.3.11f1
  BUILD_NAME: EmberThrone
  BUILDS_PATH: builds

jobs:
  # Repository secrets needed for cloud builds:
  #   Unity Personal: UNITY_EMAIL + UNITY_PASSWORD + UNITY_LICENSE (contents of Unity_lic.ulf)
  #   Unity Pro/Plus: UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL
  # Without them the build job is skipped (not failed), so main stays green during local development.
  check-license:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Unity license secrets (values are never printed)
        id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ] && { [ -n "${UNITY_SERIAL}" ] || [ -n "${UNITY_LICENSE}" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity license secrets present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build skipped::Add UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro/Plus) repository secrets to enable cloud APK builds."
          fi

  build-android:
    needs: check-license
    if: needs.check-license.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Show disk before cleanup
        run: |
          df -h
          docker system df || true

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af --volumes
          df -h
          docker system df || true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectSettings.asset') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-${{ runner.os }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ github.sha }}
          path: ${{ env.BUILDS_PATH }}/Android/*.apk
          if-no-files-found: error
