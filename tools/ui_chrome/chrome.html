<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- UI chrome source for UI Toolkit. render.py opens this page once per component (?c=name&t=theme)
     and saves a transparent PNG; Components.uss stretches it with -unity-slice-*.
     1em = 100 reference pixels (1080x1920 canvas). Colors follow docs/design/design-system.md. -->
<style>
  :root { --p0: #ff9440; --p1: #e2541a; --p2: #a3330c; --dark: #4a1604; --nav0: #b4400f; --nav1: #6a1f06; --face0: #fff8e9; --face1: #ffe5bb; }
  :root.gece { --p0: #7d86ff; --p1: #4b4ee0; --p2: #2a2a9c; --dark: #120f45; --nav0: #3b38b8; --nav1: #1c186a; --face0: #f7f8ff; --face1: #dfe4ff; }
  :root.zumrut { --p0: #46e6c4; --p1: #14a88c; --p2: #0b6c5a; --dark: #053a30; --nav0: #12846e; --nav1: #074a3e; --face0: #f1fffa; --face1: #cff5e7; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-size: 100px; }
  .c { position: absolute; left: 0; top: 0; }
  .l { position: absolute; }
  .gold { background: linear-gradient(180deg, #fff7c4 0%, #ffd447 26%, #ec9a10 60%, #ffd65e 84%, #b96a05 100%); }
  .face { background: linear-gradient(180deg, var(--face0), var(--face1)); box-shadow: inset 0 0 0 .028em rgba(140,70,0,.55), inset 0 .09em 0 rgba(0,0,0,.07), inset 0 -.05em 0 rgba(255,255,255,.6); overflow: hidden; }
  .face::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 .05em, transparent .05em .28em); }
  .prim { background: linear-gradient(180deg, var(--p0), var(--p1) 55%, var(--p2)); box-shadow: inset 0 .045em 0 rgba(255,255,255,.5), inset 0 -.06em 0 rgba(0,0,0,.28); }
  .gloss::before { content: ''; position: absolute; left: 5%; right: 5%; top: 7%; height: 40%; border-radius: .28em; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.12)); }
  .shine { box-shadow: inset 0 .035em 0 rgba(255,255,255,.75), inset 0 -.07em 0 rgba(0,0,0,.2); }
</style>
</head>
<body>
<script>
// name: [width, height, html]. Layers: outline+lip (dark), body, face. Everything stays inside the box:
// UI Toolkit cannot draw outside an element, and has no gradients or shadows of its own.
const E = n => (n / 100) + 'em';
const L = (ins, r, cls = '', style = '') => `<div class="l ${cls}" style="inset:${ins};border-radius:${r};${style}"></div>`;
const lip = 10, ol = 3;
function framed(r, inner, opts = {}) {
  // dark outline and bottom lip, gold rim, then the inner face
  const rim = opts.rim ?? 7.5;
  return L('0', E(r), '', 'background:var(--dark)')
    + L(`${E(ol)} ${E(ol)} ${E(ol + lip)} ${E(ol)}`, E(r - ol), 'gold', 'box-shadow:inset 0 .04em 0 rgba(255,255,255,.7)')
    + inner(`${E(ol + rim)} ${E(ol + rim)} ${E(ol + lip + rim)} ${E(ol + rim)}`, E(Math.max(4, r - ol - rim)));
}
function button(r, grad, edge) {
  return L('0', E(r), '', `background:${edge}`)
    + L(`${E(3.2)} ${E(3.2)} ${E(3.2 + lip)} ${E(3.2)}`, E(r - 3), 'gloss shine', `background:${grad}`);
}
const C = {
  panel: [360, 360, framed(46, (ins, r) => L(ins, r, 'face'))],
  panel_band: [400, 540, framed(46, (ins, r) => L(ins, r, 'face') + L(`${E(10.5)} ${E(10.5)} auto ${E(10.5)}`, `${r} ${r} ${E(14)} ${E(14)}`, 'prim', `height:${E(190)}`))],
  btn_green: [400, 200, button(72, 'linear-gradient(180deg,#d4ff7a 0%,#7ddb30 34%,#44ad1c 70%,#2e8a10 100%)', '#18480a')],
  btn_orange: [400, 200, button(72, 'linear-gradient(180deg,#ffe08a 0%,#ffb02e 36%,#f2780e 72%,#d0560a 100%)', '#6a2a04')],
  btn_primary: [400, 200, button(72, 'linear-gradient(180deg,var(--p0),var(--p1) 60%,var(--p2))', 'var(--dark)')],
  btn_close: [150, 160, L('0', '50%', '', 'background:#5a0610') + L(`${E(4)} ${E(4)} ${E(14)} ${E(4)}`, '50%', 'shine', 'background:radial-gradient(circle at 40% 30%,#ff9a8a,#f2262f 55%,#a00818)')
    + `<svg class="l" viewBox="0 0 100 100" style="left:${E(35)};top:${E(32)};width:${E(80)};height:${E(80)};overflow:visible"><path d="M22 22 L78 78 M78 22 L22 78" stroke="#5a0610" stroke-width="34" stroke-linecap="round"/><path d="M22 22 L78 78 M78 22 L22 78" stroke="#fff" stroke-width="18" stroke-linecap="round"/></svg>`],
  pill: [300, 100, L('0', E(50), '', 'background:var(--dark)') + L(`${E(3)} ${E(3)} ${E(3 + 7)} ${E(3)}`, E(47), '', 'background:linear-gradient(180deg,#fffaf0,#ffe6c2);box-shadow:inset 0 -.06em 0 rgba(0,0,0,.08)')],
  chip: [300, 70, L('0', E(35), '', 'background:rgba(255,255,255,.65)') + L(E(2.5), E(33), '', 'background:linear-gradient(180deg,rgba(40,20,70,.92),rgba(20,10,40,.95))')],
  badge: [84, 84, L('0', '50%', '', 'background:#5a0610') + L(E(2.5), '50%', '', 'background:#fff') + L(E(5.5), '50%', '', 'background:radial-gradient(circle at 40% 30%,#ff8a7a,#e8102a 60%,#a00818)')],
  plus: [80, 80, L('0', '50%', '', 'background:#18480a') + L(E(2.5), '50%', '', 'background:#fff') + L(E(5), '50%', 'shine', 'background:linear-gradient(180deg,#c8ff6a,#44ad1c)')
    + `<svg class="l" viewBox="0 0 100 100" style="inset:${E(14)};overflow:visible"><path d="M50 22 V78 M22 50 H78" stroke="#18480a" stroke-width="30" stroke-linecap="round"/><path d="M50 22 V78 M22 50 H78" stroke="#fff" stroke-width="16" stroke-linecap="round"/></svg>`],
  check: [80, 80, L('0', '50%', '', 'background:#18480a') + L(E(2.5), '50%', '', 'background:#fff') + L(E(5), '50%', 'shine', 'background:linear-gradient(180deg,#c8ff6a,#44ad1c)')
    + `<svg class="l" viewBox="0 0 100 100" style="inset:${E(14)};overflow:visible"><path d="M22 52 L42 72 L78 30" fill="none" stroke="#18480a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 52 L42 72 L78 30" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`],
  tag: [260, 76, L('0', E(38), '', 'background:var(--dark)') + L(E(3), E(35), 'gold') + L(E(6), E(32), 'prim')],
  ring: [220, 228, L('0', '50%', '', 'background:var(--dark)') + L(`${E(3)} ${E(3)} ${E(11)} ${E(3)}`, '50%', 'gold') + L(`${E(10)} ${E(10)} ${E(18)} ${E(10)}`, '50%', '', 'background:radial-gradient(circle at 50% 35%,#fff6d8,#8fd2ff 60%,#2f86ff);box-shadow:inset 0 0 0 .025em rgba(120,60,0,.6),inset 0 .08em .12em rgba(0,0,0,.25)')],
  slot: [180, 188, framed(34, (ins, r) => L(ins, r, '', 'background:radial-gradient(circle at 50% 30%,#ffffff,#d8ecff 60%,#a8c8f0);box-shadow:inset 0 0 0 .025em rgba(0,0,0,.25)'), { rim: 6.5 })],
  slot_warm: [180, 188, framed(34, (ins, r) => L(ins, r, 'prim'), { rim: 6.5 })],
  nav: [200, 240, L(`0 0 auto 0`, '0', '', `height:${E(4)};background:var(--dark)`) + L(`${E(4)} 0 auto 0`, '0', '', `height:${E(4)};background:#ffd25a`) + L(`${E(8)} 0 0 0`, '0', '', 'background:linear-gradient(180deg,var(--nav0),var(--nav1))')],
  nav_tab_on: [300, 300, L('0', `${E(32)} ${E(32)} 0 0`, '', 'background:var(--dark)') + L(`${E(3)} ${E(3)} 0 ${E(3)}`, `${E(29)} ${E(29)} 0 0`, '', 'background:#ffd25a') + L(`${E(7)} ${E(7)} 0 ${E(7)}`, `${E(26)} ${E(26)} 0 0`, 'prim')],
  trough: [300, 72, L('0', E(36), '', 'background:var(--dark)') + L(E(3), E(33), '', 'background:#ffd25a') + L(E(5.5), E(31), '', 'background:linear-gradient(180deg,#2a1206,#4a2410);box-shadow:inset 0 .05em .06em rgba(0,0,0,.6)')],
  fill: [200, 61, L('0', E(31), 'shine', 'background:linear-gradient(180deg,#d4ff7a,#6fd02a 45%,#3a9a14)')],
  header: [1080, 330, L('0', '0', '', 'background:linear-gradient(180deg,var(--p0),var(--p1) 60%,var(--p2))') + L('0', '0', '', 'background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.35),transparent 60%)')
    + L(`auto 0 ${E(5)} 0`, '0', '', `height:${E(5)};background:#ffd25a`) + L(`auto 0 0 0`, '0', '', `height:${E(5)};background:var(--dark)`)],
  banner: [600, 120, L('0', E(30), '', 'background:var(--dark)') + L(`${E(4)} ${E(4)} ${E(12)} ${E(4)}`, E(26), 'shine', 'background:linear-gradient(180deg,#ffe46a,#f5a516 60%,#d07a08)')],
  row: [500, 165, L('0', E(30), '', 'background:var(--dark)') + L(`${E(3)} ${E(3)} ${E(10)} ${E(3)}`, E(27), '', 'background:linear-gradient(180deg,#fffaf0,#ffe8c6)')],
  row_me: [500, 165, L('0', E(30), '', 'background:#18480a') + L(`${E(3)} ${E(3)} ${E(10)} ${E(3)}`, E(27), '', 'background:linear-gradient(180deg,#d4ff8a,#7ad83a)')],
  ribbon: [1040, 190, `<svg class="l" viewBox="0 0 520 95" preserveAspectRatio="none" style="inset:0;overflow:visible">
      <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p0)"/><stop offset=".55" stop-color="var(--p1)"/><stop offset="1" stop-color="var(--p2)"/></linearGradient>
      <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#c97a0a"/></linearGradient></defs>
      <path d="M40 26 L2 26 L18 52 L2 78 L62 78 Z" fill="var(--p2)" stroke="var(--dark)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M480 26 L518 26 L502 52 L518 78 L458 78 Z" fill="var(--p2)" stroke="var(--dark)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M40 8 Q260 -6 480 8 L480 72 Q260 58 40 72 Z" fill="url(#b)" stroke="var(--dark)" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M48 14 Q260 2 472 14 L472 66 Q260 52 48 66 Z" fill="url(#a)"/>
      <path d="M56 20 Q260 8 464 20" stroke="#fff" stroke-width="4" fill="none" opacity=".5" stroke-linecap="round"/></svg>`],
  fx_glow: [512, 512, L('0', '50%', '', 'background:radial-gradient(circle,rgba(255,240,170,.95),rgba(255,190,60,.5) 35%,rgba(255,150,30,0) 70%)')],
  fx_rays: [1024, 1024, L('0', '50%', '', 'background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.6) 0deg 8deg,rgba(255,236,150,0) 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 14%,transparent 68%);mask:radial-gradient(circle,#000 14%,transparent 68%)')],
  scrim_vignette: [512, 512, L('0', '0', '', 'background:radial-gradient(circle at 50% 40%,rgba(20,10,40,.45),rgba(10,5,25,.82))')],
};
const q = new URLSearchParams(location.search);
const name = q.get('c'), theme = q.get('t');
if (theme && theme !== 'kor') document.documentElement.classList.add(theme);
if (name === 'list') document.body.textContent = JSON.stringify(Object.fromEntries(Object.entries(C).map(([k, v]) => [k, [v[0], v[1]]])));
else if (C[name]) document.body.innerHTML = `<div class="c" style="width:${E(C[name][0])};height:${E(C[name][1])}">${C[name][2]}</div>`;
</script>
</body>
</html>
